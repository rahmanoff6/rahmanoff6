<svg xmlns="http://www.w3.org/2000/svg" width="476" height="422" viewBox="0 0 476 422"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;fill:#1f2328}.b{font-weight:600;fill:#0969da}@media (prefers-color-scheme:dark){text{fill:#d1d7e0}.b{fill:#a5d6ff}}</style><text x="238" y="21" text-anchor="middle" xml:space="preserve">Our work encompasses cybersecurity research, software</text><text x="238" y="48" text-anchor="middle" xml:space="preserve">engineering, programming, artificial intelligence, network and</text><text x="238" y="75" text-anchor="middle" xml:space="preserve">systems technologies, and emerging developments across the</text><text x="238" y="102" text-anchor="middle" xml:space="preserve">digital landscape.</text><text x="238" y="141" text-anchor="middle" class="b">Focus Areas</text><text x="238" y="168" text-anchor="middle" xml:space="preserve">• Cybersecurity  • Threat Intelligence</text><text x="238" y="195" text-anchor="middle" xml:space="preserve">• Programming  • Software Engineering</text><text x="238" y="222" text-anchor="middle" xml:space="preserve">• Artificial Intelligence  • Emerging Technologies</text><text x="238" y="249" text-anchor="middle" xml:space="preserve">• Networks &amp; Systems  • Defensive Operations</text><text x="238" y="288" text-anchor="middle" xml:space="preserve">Our commitment is to technical integrity, responsible</text><text x="238" y="315" text-anchor="middle" xml:space="preserve">innovation, and the continuous advancement of cybersecurity</text><text x="238" y="342" text-anchor="middle" xml:space="preserve">and technology.</text><text x="238" y="381" text-anchor="middle" xml:space="preserve"><tspan class="b">Principles:</tspan> Disclose Responsibly • Research Integrity •</text><text x="238" y="408" text-anchor="middle" xml:space="preserve">Innovation and Development</text></svg>