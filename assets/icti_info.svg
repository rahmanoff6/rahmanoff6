<svg xmlns="http://www.w3.org/2000/svg" width="476" height="542" viewBox="0 0 476 542"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;fill:#1f2328}.b{font-weight:600;fill:#0969da}@media (prefers-color-scheme:dark){text{fill:#d1d7e0}.b{fill:#a5d6ff}}</style><text x="238" y="21" text-anchor="middle" xml:space="preserve">ICTI is a technology focused institute dedicated to exploring,</text><text x="238" y="48" text-anchor="middle" xml:space="preserve">researching, and advancing the fields of cybersecurity and</text><text x="238" y="75" text-anchor="middle" xml:space="preserve">technology.</text><text x="238" y="114" text-anchor="middle" xml:space="preserve">Our work encompasses cybersecurity research, software</text><text x="238" y="141" text-anchor="middle" xml:space="preserve">engineering, programming, artificial intelligence, network and</text><text x="238" y="168" text-anchor="middle" xml:space="preserve">systems technologies, and emerging developments across the</text><text x="238" y="195" text-anchor="middle" xml:space="preserve">digital landscape.</text><text x="238" y="234" text-anchor="middle" class="b">Focus Areas</text><text x="238" y="261" text-anchor="middle" xml:space="preserve">• Cybersecurity  • Threat Intelligence</text><text x="238" y="288" text-anchor="middle" xml:space="preserve">• Programming  • Software Engineering</text><text x="238" y="315" text-anchor="middle" xml:space="preserve">• Artificial Intelligence  • Emerging Technologies</text><text x="238" y="342" text-anchor="middle" xml:space="preserve">• Networks &amp; Systems</text><text x="238" y="369" text-anchor="middle" xml:space="preserve">• Defensive Operations</text><text x="238" y="408" text-anchor="middle" xml:space="preserve"><tspan class="b">Commitment:</tspan> Our commitment is to technical integrity,</text><text x="238" y="435" text-anchor="middle" xml:space="preserve">responsible innovation, and the continuous advancement of</text><text x="238" y="462" text-anchor="middle" xml:space="preserve">cybersecurity and technology.</text><text x="238" y="501" text-anchor="middle" xml:space="preserve"><tspan class="b">Principles:</tspan> Disclose Responsibly • Research Integrity •</text><text x="238" y="528" text-anchor="middle" xml:space="preserve">Innovation and Development</text></svg>