<svg xmlns="http://www.w3.org/2000/svg" width="476" height="341" viewBox="0 0 476 341"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;fill:#1f2328}.b{font-weight:600;fill:#0969da}@media (prefers-color-scheme:dark){text{fill:#d1d7e0}.b{fill:#a5d6ff}}</style><text x="238" y="21" text-anchor="middle" xml:space="preserve">ICTI is a technical institute for people who want to understand</text><text x="238" y="48" text-anchor="middle" xml:space="preserve">how technology really works. It starts with cybersecurity and</text><text x="238" y="75" text-anchor="middle" xml:space="preserve">follows it into the code, networks, operating systems and AI</text><text x="238" y="102" text-anchor="middle" xml:space="preserve">around it.</text><text x="238" y="141" text-anchor="middle" xml:space="preserve"><tspan class="b">Focus areas:</tspan> Cybersecurity · Programming &amp; Software</text><text x="238" y="168" text-anchor="middle" xml:space="preserve">Engineering · Artificial Intelligence · Networks &amp; Systems ·</text><text x="238" y="195" text-anchor="middle" xml:space="preserve">Vulnerability Research · Technology Research &amp; Analysis</text><text x="238" y="234" text-anchor="middle" xml:space="preserve"><tspan class="b">Goal:</tspan> careful, sourced research and analysis, without hype and</text><text x="238" y="261" text-anchor="middle" xml:space="preserve">without fear, that students, engineers and decision-makers</text><text x="238" y="288" text-anchor="middle" xml:space="preserve">can trust.</text><text x="238" y="327" text-anchor="middle" xml:space="preserve"><tspan class="b">Principles:</tspan> Verify · Attribute · Date · Disclose responsibly</text></svg>